<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kachna 3310</title>
    <meta name="description" content="Kachnička v růžových brýlích honí vlastní stín na nočním trhu." />
    <meta name="theme-color" content="#09080d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23b06bff'/%3E%3Ccircle cx='6' cy='7.2' r='2.1' fill='none' stroke='%23ff4d9a' stroke-width='1.3'/%3E%3Ccircle cx='10.3' cy='7.2' r='2.1' fill='none' stroke='%23ff4d9a' stroke-width='1.3'/%3E%3Cpath d='M6.4 10.2h3.2l1.6 1.3H4.8z' fill='%232ee6d6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <p class="game-version" data-version>verze 12</p>
    <div id="live" class="sr" aria-live="polite"></div>
    <a class="to-kacik" href="index.html">Kačík, tunelovka</a>
    <main class="stage">
      <div class="phone">
        <div class="antenna" aria-hidden="true"></div>
        <div class="grill" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="brand-row">
          <span class="brand">KACHNA</span>
          <span class="model">3310</span>
        </div>
        <p class="flash" id="flash"></p>
        <div class="bezel">
          <div class="lcd">
            <div id="marquee">
              <h1>Kachna 3310</h1>
              <p id="tagline"></p>
            </div>
            <div id="hud" hidden>
              <span id="hud-name"></span>
              <strong id="hud-score"></strong>
              <span id="hud-shadow"></span>
              <span id="hud-combo"></span>
              <span id="hud-meter"></span>
            </div>
            <div class="playfield" id="playfield">
              <div class="glass" id="glass">
                <canvas id="game" width="480" height="480" aria-hidden="true"></canvas>
              </div>
              <div id="banner" hidden></div>
              <div id="countdown" hidden></div>
            </div>
            <div id="overlay" hidden></div>
            <div class="soft">
              <button type="button" id="soft-name">Jméno</button>
              <span class="soft-mark" aria-hidden="true">kvá</span>
              <button type="button" id="soft-mute">Ztišit zobák</button>
            </div>
          </div>
        </div>
        <div class="pad" id="pad">
          <span></span>
          <button type="button" data-dir="up" aria-label="Nahoru">▲</button>
          <span></span>
          <button type="button" data-dir="left" aria-label="Doleva">◀</button>
          <button type="button" id="kva">KVÁ</button>
          <button type="button" data-dir="right" aria-label="Doprava">▶</button>
          <span></span>
          <button type="button" data-dir="down" aria-label="Dolů">▼</button>
          <span></span>
        </div>
        <p class="legal" id="legal"></p>
        <span class="sticker" aria-hidden="true">NOČNÍ TRH</span>
      </div>

      <aside class="dossier" aria-labelledby="book-title">
        <span class="stamp">PLATÍ JEN TADY</span>
        <h2 id="book-title">Kniha stínů</h2>
        <p class="lede" id="book-lede"></p>
        <h3>Tvoje peří</h3>
        <p id="you"></p>
        <h3>Síň kváknutí</h3>
        <p class="fine" id="hall-note"></p>
        <p class="fine" id="hall-empty" hidden></p>
        <ol id="hall"></ol>
        <h3>Jak se počítá kvá</h3>
        <div id="rules"></div>
        <button type="button" id="wipe">Vymazat paměť trhu</button>
      </aside>
    </main>
    <noscript>
      <p>Tahle kachna potřebuje JavaScript. I růžové brýle mají svoje meze.</p>
    </noscript>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
